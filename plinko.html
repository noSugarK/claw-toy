<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>赛博弹弹珠</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#0b0910; --panel:#17111f; --panel-2:#1e1728;
  --ink:#f5efe8; --dim:#9c8fa8; --dim-2:#6d6376;
  --hot:#ff2e6a; --cyan:#3ee8ff; --gold:#ffcf4a; --violet:#8a63ff;
  --frame:#c81249; --frame-dark:#6d0a29;
  --cjk:"PingFang SC","Microsoft YaHei",sans-serif;
  /* 与大厅一致的液态玻璃质感令牌 */
  --glass-bg: rgba(255,255,255,.08);
  --glass-bg-strong: rgba(255,255,255,.13);
  --glass-border: rgba(255,255,255,.18);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 14px 34px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);
  font:14px/1.4 var(--cjk),-apple-system,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.disp{font-family:"Bungee",var(--cjk),sans-serif}
.num{font-family:"Chakra Petch",var(--cjk),sans-serif; font-variant-numeric:tabular-nums}

/* ---------- 环境光斑：呼应大厅液态玻璃背景 ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.6;
  background:
    radial-gradient(40vmax 40vmax at -8vmax -10vmax, var(--hot), transparent 60%),
    radial-gradient(36vmax 36vmax at 108vw -8vmax, var(--cyan), transparent 60%),
    radial-gradient(32vmax 32vmax at -6vmax 108vh, var(--gold), transparent 62%);
  animation:ambientDrift 28s ease-in-out infinite;
}
@keyframes ambientDrift{0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(1.6vmax,-1.4vmax) scale(1.05)}}
@media (prefers-reduced-motion:reduce){ .ambient{animation:none} }

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;padding:12px 14px;display:flex;
     align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.hud-left{display:flex;align-items:center;gap:9px}
.backbtn{pointer-events:auto;width:28px;height:28px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:14px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:var(--glass-shadow);transition:transform .15s,background .15s}
.backbtn:active{transform:scale(.9);background:var(--glass-bg-strong)}
.brand{font-weight:800;letter-spacing:.18em;font-size:13px;
  background:linear-gradient(90deg,var(--cyan),var(--hot));-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:0 0 18px rgba(62,232,255,.25)}
.stats{display:flex;gap:10px}
.chip{background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;
  -webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:var(--glass-shadow);font-size:12px}
.chip b{color:var(--gold);font-size:14px;display:inline-block}
.bump{animation:bump .34s cubic-bezier(.3,1.4,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}

/* ---------- 舞台 ---------- */
.stage{position:fixed; inset:0; z-index:1; display:flex; align-items:center; justify-content:center;
  padding:64px 16px 108px; perspective:1100px}
.pinball{
  position:relative; width:min(94vw,460px); transform:rotateX(6deg); transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--frame),var(--frame-dark));
  border-radius:22px; padding:14px; box-shadow:0 40px 90px -34px rgba(0,0,0,.8);
}
.pinball-inner{background:#120c1a; border-radius:14px; padding:16px 16px 20px; position:relative; overflow:hidden}
.pinball-inner::before{
  content:"";position:absolute;left:0;right:0;top:0;height:150px;
  background:radial-gradient(60% 100% at 50% 0%,rgba(255,230,190,.10),transparent 70%);
  pointer-events:none;
}

.mult-row{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; position:relative; z-index:1}
.mult{
  border-radius:7px; padding:7px 0; text-align:center; font-family:"Chakra Petch",sans-serif;
  font-weight:700; font-size:14px; color:var(--dim-2); border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);
  transition:color .12s, box-shadow .12s, border-color .12s;
}
.mult small{display:block; font-size:7.5px; font-weight:600; letter-spacing:.08em; margin-top:1px; opacity:.7}
.mult.chase{color:var(--cyan); border-color:rgba(62,232,255,.5); box-shadow:0 0 14px -3px rgba(62,232,255,.7)}
.mult.lock{color:var(--gold); border-color:rgba(255,207,74,.6); overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,207,74,.4), 0 0 20px -3px rgba(255,207,74,.75)}
/* 锁定态扫一道玻璃高光，跟大厅卡片的液态玻璃语言呼应 */
.mult.lock::after, .exit.lock::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);
  background-size:220% 100%; background-position:120% 0;
  animation:sheen 1.6s ease-in-out .1s 1;
}
@keyframes sheen{to{background-position:-40% 0}}

.cab-body{display:flex; gap:10px; align-items:stretch; margin-top:12px; position:relative; z-index:1}
.cab-main{flex:1; min-width:0; display:flex; flex-direction:column}

.board{position:relative; height:216px; border-radius:8px; overflow:hidden;
  background:linear-gradient(180deg,#1c1528,#120c1a 60%,#150f20);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 14px 22px rgba(0,0,0,.5), inset 0 -8px 16px rgba(0,0,0,.4);
}
.entry-path{position:absolute; top:2px; right:2px; width:70%; height:22%}
.peg-field{position:absolute; left:0; right:0; bottom:0; height:75%}
.peg{position:absolute; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff,#c6ced9 45%,#5a6270 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.5);
}
/* 唯一一颗球：从内轨蓄力、发射、拐进主面板、落到出口，全程同一个元素、同一套坐标系
   （相对 .pinball-inner 用 px 定位，靠 getBoundingClientRect 换算，不用百分比） */
.ball{
  position:absolute; top:0; left:0; width:15px; height:15px; margin:-7.5px 0 0 -7.5px;
  border-radius:50%; z-index:9; pointer-events:none;
  background:radial-gradient(circle at 32% 28%,#fff,var(--gold) 55%,#a97300 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.55), 0 0 12px 3px rgba(255,207,74,.55);
  transition:left .16s cubic-bezier(.34,.2,.4,1), top .16s cubic-bezier(.34,.2,.4,1);
}
.ball.notransition{transition:none}
.ball.spin{animation:ballspin .45s linear infinite}
@keyframes ballspin{to{transform:rotate(360deg)}}
.ball.squash{animation:squash .2s ease-out}
@keyframes squash{40%{transform:scale(1.4,.6)}}

.exit-row{display:grid; grid-template-columns:repeat(15,minmax(0,1fr)); gap:2.5px; position:relative; z-index:1}
.exit{height:34px; min-width:0; border-radius:5px 5px 2px 2px; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; gap:3px; padding-bottom:4px; overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.32));
  border:1px solid rgba(255,255,255,.07); border-top:none; position:relative;
}
.exit .dot{width:5.5px; height:5.5px; border-radius:50%; background:#3a3448; transition:background .12s,box-shadow .12s}
.exit .exit-label{font-family:"Chakra Petch",sans-serif; font-size:7px; font-weight:700; color:transparent; line-height:1}
.exit.chase .dot{background:var(--cyan); box-shadow:0 0 7px 2px rgba(62,232,255,.7)}
.exit.lock{border-color:rgba(255,207,74,.4)}
.exit.lock .dot{background:var(--gold); box-shadow:0 0 9px 3px rgba(255,207,74,.85)}
.exit.lock .exit-label{color:var(--gold)}
.exit.landed{outline:2px solid var(--ink); outline-offset:-2px}

.readout-strip{display:flex; flex-wrap:wrap; gap:10px 16px; font-family:"Chakra Petch",sans-serif;
  justify-content:center; margin-top:14px}
.readout-strip div b{display:block; font-size:17px; color:var(--ink)}
.readout-strip div small{font-size:8.5px; color:var(--dim); letter-spacing:.06em}

.cab-lever{width:44px; display:flex; flex-direction:column; align-items:center; gap:8px}
.cab-lever .rail{flex:1; width:11px; min-height:120px; border-radius:7px; background:#1c1424;
  border:1px solid rgba(255,255,255,.1); position:relative; box-shadow:inset 0 3px 8px rgba(0,0,0,.55)}
.cab-lever .rail::before{content:"";position:absolute; top:-3px; left:-24px; width:26px; height:16px;
  border:2.5px solid rgba(255,255,255,.2); border-right:none; border-bottom:none; border-radius:13px 0 0 0}
.cab-lever .power-fill{position:absolute; left:0; right:0; bottom:0; border-radius:0 0 6px 6px;
  height:0%; background:linear-gradient(180deg,rgba(255,207,74,.1),rgba(255,207,74,.55));
  transition:height .06s linear}

.plunger{position:absolute; right:0; bottom:12px; z-index:6; display:flex; align-items:center; touch-action:none}
.plunger .cap{margin-right:6px; font-family:"Chakra Petch",sans-serif; font-size:8px; letter-spacing:.08em;
  color:rgba(255,255,255,.55); white-space:nowrap}
.plunger .rod{width:26px; height:6px; border-radius:3px; margin-right:-3px;
  background:linear-gradient(90deg,#8a828e,#d8d3dc); box-shadow:0 1px 2px rgba(0,0,0,.4)}
.plunger .knob{width:38px; height:38px; border-radius:50%; cursor:grab;
  background:radial-gradient(circle at 32% 28%,#ff9db3,var(--hot) 60%,#8f0031);
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.15)}
.plunger.charging .knob{cursor:grabbing}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:14px max(14px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(transparent,rgba(6,4,10,.55) 38%,rgba(6,4,10,.92))}
.big{position:relative;overflow:hidden;width:82px;height:82px;border-radius:50%;
  font-size:13px;font-weight:800;letter-spacing:.1em;border:1px solid rgba(255,255,255,.2);
  font-family:inherit;cursor:pointer;transition:transform .16s cubic-bezier(.2,.8,.3,1.2),box-shadow .16s;
  flex:0 0 auto;color:#fff;background:radial-gradient(circle at 35% 30%,#ff5c86,#c9003f 70%);
  box-shadow:0 5px 0 #6b0022,0 12px 30px rgba(201,0,63,.45)}
.big::before{ /* 玻璃高光弧，跟大厅/抓娃娃统一的按钮语言 */
  content:"";position:absolute;inset:2px;border-radius:50%;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.55),transparent 42%);
  mix-blend-mode:overlay;opacity:.8}
.big:active{transform:translateY(5px);box-shadow:0 0 0 #6b0022}
.big[disabled]{filter:grayscale(.85) brightness(.55);box-shadow:0 5px 0 #222;cursor:default}

/* ---------- 投珠控制：数量选择 + 自定义输入，随时可加注 ---------- */
.betpad{display:flex;flex-direction:column;gap:8px;align-items:center}
.betrow{display:flex;gap:7px}
.betchip{padding:9px 13px;border-radius:999px;font-weight:800;font-size:12.5px;letter-spacing:.01em;
  font-family:inherit;color:#3a2600;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ffe595,#d99a00 70%);
  border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 0 #7a5600,0 8px 16px rgba(217,154,0,.35);
  transition:transform .12s,box-shadow .12s}
.betchip:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5600}
.betchip[disabled]{filter:grayscale(.85) brightness(.55);box-shadow:0 4px 0 #222;cursor:default}
.betcustom{display:flex;gap:6px}
.betcustom input{width:60px;text-align:center;border-radius:10px;border:1px solid var(--glass-border);
  background:var(--glass-bg);color:var(--ink);font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
  padding:8px 4px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.betcustom input::-webkit-outer-spin-button,.betcustom input::-webkit-inner-spin-button{margin:0}
.betcustom button{padding:8px 14px;border-radius:10px;border:1px solid var(--glass-border);font-weight:700;
  font-family:inherit;font-size:12.5px;background:var(--glass-bg-strong);color:var(--ink);cursor:pointer}
.betcustom button[disabled]{opacity:.4;cursor:default}
.hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#4d4757;
  font-size:10.5px;z-index:4;pointer-events:none}
@media (max-width:400px){
  .betchip{padding:8px 10px;font-size:11.5px}
  .betcustom input{width:50px}
  .big{width:72px;height:72px;font-size:12px}
}

/* ---------- 调试 ---------- */
#dev{position:fixed;right:10px;top:52px;z-index:6;width:210px;font-size:12px;
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);border-radius:14px;
  padding:10px 12px;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--glass-shadow)}
#dev.hid>*:not(.dh){display:none}
.dh{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  font-weight:700;color:var(--cyan);letter-spacing:.05em}
#dev label{display:block;margin-top:9px;color:var(--dim)}
#dev label span{color:var(--ink);float:right;font-variant-numeric:tabular-nums}
#dev input[type=range]{width:100%;margin-top:3px;accent-color:var(--hot)}
#dev .row{display:flex;gap:6px;margin-top:10px}
#dev .row button{flex:1;padding:6px;border-radius:8px;font-size:11px;font-family:inherit;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
#log{margin-top:9px;color:#6f6880;font-size:11px;min-height:2.6em;font-variant-numeric:tabular-nums}

/* ---------- 结算 ---------- */
#toast{position:fixed;inset:0;display:none;place-items:center;z-index:20;
  background:rgba(6,4,10,.5);backdrop-filter:blur(10px)}
#toast.show{display:grid;animation:fade .22s}
@keyframes fade{from{opacity:0}}
.card{position:relative;width:min(300px,82vw);padding:26px 22px;text-align:center;border-radius:26px;
  background:linear-gradient(160deg,rgba(60,48,90,.5),rgba(20,15,30,.55));
  border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--glass-shadow), 0 30px 70px -20px rgba(0,0,0,.65);
  animation:cardIn .36s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card .em{font-size:52px;line-height:1;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:21px}
.card p{margin:0 0 20px;color:var(--dim);font-size:13px}
.card button{width:100%;padding:13px;border-radius:14px;border:none;font-weight:700;font-family:inherit;
  background:linear-gradient(90deg,var(--cyan),#7a5cff);color:#08060d;cursor:pointer}
.card .x{position:absolute;top:14px;right:14px;width:26px;height:26px;padding:0;
  border-radius:50%;font-size:12px;font-weight:400;line-height:1;
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--dim);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform .15s,background .15s,color .15s}
.card .x:active{transform:scale(.88);background:var(--glass-bg-strong);color:var(--ink)}

/* ---------- 五彩纸屑 + 球的拖尾余晖 ---------- */
.confetti-bit{position:fixed;top:38%;width:7px;height:10px;border-radius:2px;z-index:25;
  pointer-events:none;animation:confettiFall 1.15s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confettiFall{
  0%{transform:translate(0,0) rotate(0deg);opacity:1}
  100%{transform:translate(calc(var(--dx,0) * 130px),68vh) rotate(720deg);opacity:0}
}
.trail-bit{position:absolute;top:0;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,var(--gold),transparent 70%);
  animation:trailFade .5s ease-out forwards}
@keyframes trailFade{to{opacity:0;transform:scale(.4)}}
.punch{animation:punch .3s ease-out}
@keyframes punch{30%{transform:rotateX(6deg) scale(1.03)}}

@media (max-width:430px){
  .stage{padding:56px 10px 96px}
  .exit{height:28px}
  .exit .exit-label{font-size:6px}
}
@media (prefers-reduced-motion:reduce){
  .ball{transition:none}
  .ball.spin,.ball.squash,.punch,.confetti-bit,.trail-bit,.mult.lock::after,.exit.lock::after{animation:none}
}
</style>
</head>
<body>
<div class="ambient"></div>

<div class="hud">
  <div class="hud-left">
    <a class="backbtn" href="index.html" title="返回大厅" aria-label="返回大厅">←</a>
    <div class="brand">赛博弹弹珠</div>
  </div>
  <div class="stats">
    <div class="chip">弹珠 <b id="marbles">30</b></div>
    <div class="chip">本局 <b id="betDisplay">0</b></div>
  </div>
</div>

<div id="dev" class="hid">
  <div class="dh"><span>◈ 概率调试</span><span id="devt">+</span></div>
  <label>命中率加成 <span id="v_bias">0%</span><input id="s_bias" type="range" min="-50" max="100" value="0"></label>
  <div class="row"><button id="b_free">+50 弹珠</button><button id="b_reset">重置</button></div>
  <div id="log">等待投珠</div>
</div>

<div class="stage">
  <div class="pinball">
    <div class="pinball-inner">

      <div class="mult-row" id="multRow">
        <div class="mult" data-mult="2">2<small>×</small></div>
        <div class="mult" data-mult="4">4<small>×</small></div>
        <div class="mult" data-mult="6">6<small>×</small></div>
        <div class="mult" data-mult="8">8<small>×</small></div>
        <div class="mult" data-mult="10">10<small>×</small></div>
      </div>

      <div class="cab-body">
        <div class="cab-main">
          <div class="board" id="board">
            <svg class="entry-path" viewBox="0 0 220 60" preserveAspectRatio="none">
              <path d="M212 6 C 160 6, 90 14, 12 50" fill="none" stroke="rgba(255,255,255,.3)"
                    stroke-width="2.4" stroke-dasharray="4 6" stroke-linecap="round"/>
            </svg>
            <div class="peg-field" id="pegField"></div>
          </div>

          <div class="exit-row" id="exitRow"></div>

          <div class="readout-strip">
            <div><b class="num" id="roundMult">--</b><small>本局倍率</small></div>
            <div><b class="num" id="powerReadout">--</b><small>拉杆力度</small></div>
          </div>
        </div>

        <div class="cab-lever">
          <div class="rail" id="leverRail">
            <div class="power-fill" id="powerFill"></div>
          </div>
        </div>
      </div>

      <div class="ball" id="ball"></div>
    </div>

    <div class="plunger" id="plunger">
      <span class="cap">拉我发射</span>
      <div class="rod"></div>
      <div class="knob" id="plungerKnob"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="betpad">
    <div class="betrow">
      <button class="betchip" data-n="1">投1</button>
      <button class="betchip" data-n="5">投5</button>
      <button class="betchip" data-n="10">投10</button>
    </div>
    <div class="betcustom">
      <input type="number" id="betQty" min="1" step="1" value="3" inputmode="numeric">
      <button id="btnBetCustom">投入</button>
    </div>
  </div>
  <button class="big" id="btnStop" disabled>停 止</button>
</div>
<div class="hint">投珠即开始变灯，随时可加注；按停止锁定倍率和出口，直到结算前都能继续投珠</div>

<div id="toast"><div class="card">
  <button class="x" id="t_close" aria-label="关闭">✕</button>
  <div class="em" id="t_em">🎯</div>
  <h2 id="t_h">中了！</h2>
  <p id="t_p"></p>
  <button id="t_ok">再来一次</button>
</div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   0. 配置 + 状态
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  N_EXIT: 15, ROWS: 6,
  MULTS: [2,4,6,8,10],
  LIT_COUNT: {2:6, 4:4, 6:2, 8:1, 10:1},        // 倍率越高，留给玩家的出口越少
  MULT_WEIGHTS: {2:40, 4:25, 6:17, 8:10, 10:8}, // 倍率越低，这一局摇到它的概率越大
  START_MARBLES: 30,
  winBias: 0,          // 调试用命中率加成（-0.5~1），0 = 不加成，只影响 rollLanding
};
const G = {
  marbles: CFG.START_MARBLES,
  bet: 0,              // 本局已投入的弹珠数，从「停止」到结算前都能继续累加
  state: 'idle',      // idle | chasing | locked | charging | falling | settle
  lit: new Set(), mult: null,
};
const el = id=>document.getElementById(id);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rnd = (a,b)=>a+Math.random()*(b-a);
const wait = ms=>new Promise(r=>setTimeout(r,ms));

const uiMarbles=el('marbles'), uiBet=el('betDisplay'), uiRoundMult=el('roundMult'), uiPower=el('powerReadout');

/* ---- 数字变化时的跳动反馈 ---- */
function setNum(elm, val){
  elm.textContent = val;
  elm.classList.remove('bump'); void elm.offsetWidth; elm.classList.add('bump');
}
function log(s){ const l=el('log'); if(l) l.textContent = s; }
/* ---- 五彩纸屑：中奖那一下的视觉爆点，跟抓娃娃机共用同一套样式 ---- */
function confetti(n=20){
  const colors=['var(--hot)','var(--gold)','var(--cyan)','var(--violet)','#fff'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='confetti-bit';
    s.style.left=(42+Math.random()*16)+'%';
    s.style.setProperty('--dx',(Math.random()*2-1).toFixed(2));
    s.style.background=colors[i%colors.length];
    s.style.animationDelay=(Math.random()*.18)+'s';
    document.body.appendChild(s);
    s.addEventListener('animationend',()=>s.remove());
  }
}

/* ══════════════════════════════════════════════════════════════
   1. 音效 —— 与抓娃娃机同一套程序化合成，复用是因为已经验证过好用
   ══════════════════════════════════════════════════════════════ */
const SFX = (()=>{
  let ac=null, master=null;
  const on = ()=>{ if(ac) return ac;
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value=.5; master.connect(ac.destination);
    return ac; };
  const tone=(f,d,type='square',g=.10,f2=null,delay=0)=>{ if(!ac) return;
    const t=ac.currentTime+delay, o=ac.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    const gn=ac.createGain(); gn.gain.setValueAtTime(0,t);
    gn.gain.linearRampToValueAtTime(g,t+.008);
    gn.gain.exponentialRampToValueAtTime(1e-4,t+d);
    o.connect(gn); gn.connect(master); o.start(t); o.stop(t+d+.02); };
  const noise=(d,g,lp,delay=0)=>{ if(!ac) return;
    const n=Math.floor(ac.sampleRate*d), buf=ac.createBuffer(1,n,ac.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(); s.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
    const gn=ac.createGain(); gn.gain.value=g;
    s.connect(f); f.connect(gn); gn.connect(master);
    s.start(ac.currentTime+delay); };
  return {
    unlock(){ on(); if(ac.state==='suspended') ac.resume(); },
    coin(){ tone(760,.06,'square',.10); tone(1180,.10,'square',.09,null,.06); noise(.05,.05,3000,.0); },
    tick(){ tone(1500,.025,'square',.035); },
    lock(){ tone(660,.1,'square',.09,880); tone(990,.14,'square',.07,1320,.06); },
    charge(v){ tone(120+v*180,.03,'sawtooth',.03+v*.03); },
    launch(){ tone(180,.12,'sawtooth',.09,520); if(navigator.vibrate)navigator.vibrate(25); },
    bounce(){ tone(rnd(300,420),.04,'triangle',.06); },
    thud(){ noise(.16,.20,260); tone(72,.13,'sine',.13,48); },
    win(mult){ const n=Math.min(6,2+Math.round(mult/2));
      [523,659,784,1046,1318,1568].slice(0,n).forEach((f,i)=>tone(f,.16,'square',.10,null,i*.075));
      noise(.5,.05,5200,.1); if(navigator.vibrate)navigator.vibrate([40,60,120]); },
    fail(){ tone(340,.16,'sawtooth',.07,150); tone(230,.22,'sawtooth',.06,90,.13); },
  };
})();

/* ══════════════════════════════════════════════════════════════
   2. 钉板 + 出口：均匀网格，间距对齐 15 个出口的宽度
   ══════════════════════════════════════════════════════════════ */
const pitch = 100 / CFG.N_EXIT;
const colX = i => pitch/2 + i*pitch;               // 第 i 个出口（0 起）的中心 x%

const pegField = el('pegField');
{
  const M = 8;
  const frag = document.createDocumentFragment();
  for(let r=0; r<CFG.ROWS; r++){
    const y = M + r*(100-2*M)/(CFG.ROWS-1);
    const even = r%2===0;
    const n = even ? CFG.N_EXIT : CFG.N_EXIT-1;
    for(let i=0;i<n;i++){
      const x = even ? pitch/2+i*pitch : (i+1)*pitch;
      const p = document.createElement('div');
      p.className='peg'; p.style.left=x+'%'; p.style.top=y+'%';
      frag.appendChild(p);
    }
  }
  pegField.appendChild(frag);
}
const exitRow = el('exitRow');
for(let i=0;i<CFG.N_EXIT;i++){
  const e = document.createElement('div');
  e.className='exit';
  e.innerHTML = '<span class="dot"></span><span class="exit-label"></span>';
  exitRow.appendChild(e);
}
const exits = [...exitRow.children];
const multTiles = [...document.querySelectorAll('.mult')];

/* ══════════════════════════════════════════════════════════════
   3. 结果判定 —— 纯函数，跟动画完全分开，方便自检
   ══════════════════════════════════════════════════════════════ */
const MULT_WEIGHT_TOTAL = CFG.MULTS.reduce((s,m)=>s+CFG.MULT_WEIGHTS[m],0);
function pickMult(){
  let r = Math.random()*MULT_WEIGHT_TOTAL;
  for(const m of CFG.MULTS){ r -= CFG.MULT_WEIGHTS[m]; if(r<0) return m; }
  return CFG.MULTS[CFG.MULTS.length-1];   // 浮点误差兜底
}
// 从 [0,max) 里不重复地抽 n 个下标：局部 Fisher-Yates，固定跑 max 步就结束。
// 不能用"随机数不重复就一直抽"的写法——如果 Math.random 被外部改写成常量
// （调试脚本、某些浏览器扩展都干过这事），那种写法会死循环卡死整个页面。
function pickDistinct(n, max){
  const arr = Array.from({length:max}, (_,i)=>i);
  for(let i=max-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr.slice(0,n);
}
function pickRound(){
  const mult = pickMult();
  const need = CFG.LIT_COUNT[mult];
  const lit = new Set(pickDistinct(need, CFG.N_EXIT));
  return {mult, lit};
}
function rollLanding(lit){
  // 命中率就是「亮灯出口数 / 15」——不是另外定的赔率表，跟灯位数量天然绑死；
  // winBias 只是调试面板用来临时加成/削弱命中率，默认 0 时跟原公式完全一致
  const chance = clamp((lit.size / CFG.N_EXIT) * (1+CFG.winBias), 0, 1);
  const win = Math.random() < chance;
  const pool = [];
  for(let i=0;i<CFG.N_EXIT;i++) if(lit.has(i)===win) pool.push(i);
  const col = pool[Math.floor(Math.random()*pool.length)];
  return {win, col};
}

/* ══════════════════════════════════════════════════════════════
   4. 跑马灯：投币后开始闪，拉杆一松就冻结在一次新摇的结果上
   ══════════════════════════════════════════════════════════════ */
let chaseTimer = null;
function clearLights(){
  multTiles.forEach(t=>t.classList.remove('chase','lock'));
  exits.forEach(e=>{ e.classList.remove('chase','lock','landed'); e.querySelector('.exit-label').textContent=''; });
}
function chaseTick(){
  multTiles.forEach(t=>t.classList.remove('chase'));
  multTiles[Math.floor(Math.random()*multTiles.length)].classList.add('chase');
  exits.forEach(e=>e.classList.remove('chase'));
  const n = 2+Math.floor(Math.random()*2);
  pickDistinct(n, CFG.N_EXIT).forEach(i=>exits[i].classList.add('chase'));
  SFX.tick();
}
function startChase(){
  clearLights(); uiRoundMult.textContent='--';
  chaseTimer = setInterval(chaseTick, 110);
}
function stopChaseAndLock(){
  clearInterval(chaseTimer); clearLights();
  const {mult, lit} = pickRound();
  G.mult = mult; G.lit = lit;
  multTiles.forEach(t=>t.classList.toggle('lock', +t.dataset.mult===mult));
  uiRoundMult.textContent = mult+'×';
  exits.forEach((e,i)=>{
    const on = lit.has(i);
    e.classList.toggle('lock', on);
    e.querySelector('.exit-label').textContent = on ? mult+'×' : '';
  });
  SFX.lock();
}

/* ══════════════════════════════════════════════════════════════
   5. 投珠（随时可加注）/ 停止 / 拉杆蓄力 / 发射 / 掉落动画
   ══════════════════════════════════════════════════════════════ */
const btnStop = el('btnStop');
const betChips = [...document.querySelectorAll('.betchip')];
const betQtyInput = el('betQty'), btnBetCustom = el('btnBetCustom');

// 能投珠的状态：从投第一颗（idle）到球落地结算前（falling）都算数，
// 对应需求「停下直到结算都可以投注」——停止只锁多倍率/出口，不锁投注。
const BETTABLE = ['idle','chasing','locked','charging','falling'];
function refreshBetButtons(){
  betChips.forEach(b=>{ b.disabled = G.marbles < +b.dataset.n; });
  btnBetCustom.disabled = G.marbles < 1;
}
function addMarbles(qty){
  qty = Math.floor(qty);
  if(!(qty>=1) || !BETTABLE.includes(G.state) || G.marbles<qty) return;
  SFX.unlock();
  const startingRound = G.state==='idle';
  G.marbles -= qty; G.bet += qty;
  setNum(uiMarbles, G.marbles); setNum(uiBet, G.bet);
  SFX.coin();
  refreshBetButtons();
  if(startingRound){
    G.state = 'chasing';
    btnStop.disabled = false;
    startChase();
    log(`本局开始，已投 ${G.bet} 颗`);
  }else{
    log(`追加投注，共投 ${G.bet} 颗`);
  }
}
betChips.forEach(b=> b.onclick = ()=> addMarbles(+b.dataset.n));
btnBetCustom.onclick = ()=> addMarbles(+betQtyInput.value || 1);

function pressStop(){
  if(G.state!=='chasing') return;
  stopChaseAndLock();
  G.state = 'locked';
  btnStop.disabled = true;
  log(`锁定 ${G.mult}×，已投 ${G.bet} 颗，停止前后都能继续加注`);
}
btnStop.onclick = pressStop;

/* ---- 球的坐标系统：只有一个球元素，全程相对 .pinball-inner 用 px 定位 ----
   钉板收了 6°/rotateX 的 3D 倾斜，但 getBoundingClientRect 拿到的是变换后的
   真实渲染坐标，所以下面这套换算在有倾斜的情况下依然是对的，不用另外补偿。 */
const ball = el('ball');
const pinnerEl = document.querySelector('.pinball-inner');
const railEl = el('leverRail'), boardEl = el('board');
const ENTRY_X = 96, ENTRY_Y = 5;    // 入板口在主面板里的位置（% of board）

const relTo = (r, ir) => ({x:r.left-ir.left, y:r.top-ir.top});
function railRestXY(){
  const rr = railEl.getBoundingClientRect(), ir = pinnerEl.getBoundingClientRect();
  const o = relTo(rr, ir);
  return { x: o.x + rr.width/2, y: o.y + rr.height*0.92 };
}
function railTopXY(){
  const rr = railEl.getBoundingClientRect(), ir = pinnerEl.getBoundingClientRect();
  const o = relTo(rr, ir);
  return { x: o.x + rr.width/2, y: o.y + 3 };
}
function boardPt(xPct, yPct){
  const br = boardEl.getBoundingClientRect(), ir = pinnerEl.getBoundingClientRect();
  const o = relTo(br, ir);
  return { x: o.x + br.width*xPct/100, y: o.y + br.height*yPct/100 };
}
function exitPt(i){
  const er = exits[i].getBoundingClientRect(), ir = pinnerEl.getBoundingClientRect();
  const o = relTo(er, ir);
  return { x: o.x + er.width/2, y: o.y + 7 };
}
function placeBall(pt){ ball.style.left = pt.x+'px'; ball.style.top = pt.y+'px'; }
function spawnTrail(pt){    // 掉落路径上留一点余晖，帮玩家看清球滚过的轨迹
  const t = document.createElement('span');
  t.className = 'trail-bit';
  t.style.left = pt.x+'px'; t.style.top = pt.y+'px';
  pinnerEl.appendChild(t);
  t.addEventListener('animationend', ()=>t.remove());
}
function placeBallInstant(pt){
  ball.classList.add('notransition'); placeBall(pt);
  ball.getBoundingClientRect();               // 强制回流，避免下一次改动被并进这次的"无动画"里
  ball.classList.remove('notransition');
}
placeBallInstant(railRestXY());               // 开局：球静静待在内轨里
addEventListener('resize', ()=>{ if(G.state!=='falling') placeBallInstant(railRestXY()); });

const plunger = el('plunger'), plungerKnob = el('plungerKnob');
const powerFill = el('powerFill');
const PULL_MAX = 46; // 拉杆最大行程 px
let pullPid = null, pullStartY = 0, power = 0;

function setPlunger(p){
  power = clamp(p,0,1);
  plungerKnob.style.transform = `translateY(${power*15}px)`;   // 往下拉，手柄跟着往下走，不是横着走
  powerFill.style.height = (power*100).toFixed(0)+'%';
  uiPower.textContent = power>0.02 ? Math.round(power*100)+'%' : '--';
}
function resetPlunger(){ setPlunger(0); plunger.classList.remove('charging'); }

plungerKnob.addEventListener('pointerdown', e=>{
  if(G.state!=='locked') return;   // 必须先按「停止」锁定倍率和出口，才能拉杆发射
  SFX.unlock();
  pullPid = e.pointerId;
  try{ plungerKnob.setPointerCapture(pullPid); }catch{}   // 极端情况下 capture 失败也不能挡住蓄力
  pullStartY = e.clientY; plunger.classList.add('charging');
  ball.classList.add('notransition');    // 蓄力时球跟手指 1:1，不要过渡动画的延迟感
  G.state = 'charging';
  e.preventDefault();
});
plungerKnob.addEventListener('pointermove', e=>{
  if(e.pointerId!==pullPid || G.state!=='charging') return;
  const dy = e.clientY - pullStartY;              // 往下拉才蓄力，跟真实弹簧一致
  const p = clamp(dy/PULL_MAX, 0, 1);
  if(Math.abs(p-power)>0.02) SFX.charge(p);
  setPlunger(p);
  const rest = railRestXY();
  placeBall({x:rest.x, y:rest.y + p*16});         // 球跟着拉杆的力度往下退，像被压缩的弹簧
  e.preventDefault();
});
function pullEnd(e){
  if(e.pointerId!==pullPid) return;
  pullPid = null;
  if(G.state!=='charging') return;
  const p = power;
  resetPlunger();
  ball.classList.remove('notransition');
  if(p < 0.08){ G.state='locked'; placeBall(railRestXY()); return; }  // 拉太轻，弹簧把球送回原位，当没拉
  doLaunch(p);
}
plungerKnob.addEventListener('pointerup', pullEnd);
plungerKnob.addEventListener('pointercancel', pullEnd);

async function doLaunch(p){
  G.state = 'falling';
  // 倍率和亮灯出口在「停止」那一下已经锁定了，这里只管让球落进哪个口
  const {win, col} = rollLanding(G.lit);
  SFX.launch();
  ball.classList.add('spin');

  // 1) 内轨发射：从蓄力位置冲到轨道顶部，力度越大冲得越快
  const dur1 = (0.22 - p*0.09);
  ball.style.transitionDuration = dur1.toFixed(2)+'s';
  placeBall(railTopXY());
  await wait(dur1*1000 + 20);

  // 2) 轨道顶部拐进主面板：中间插一个弧顶点，别让球直挺挺地斜线飞过去
  ball.style.transitionDuration = '.14s';
  const top = railTopXY(), entry = boardPt(ENTRY_X, ENTRY_Y);
  placeBall({ x:(top.x+entry.x)/2, y:Math.min(top.y, entry.y)-12 });
  await wait(150);
  placeBall(entry);
  await wait(150);

  // 3) 主面板内下落：沿钉子的每一排前进，中途带点抖动，最后一排精确落到目标出口
  const M = 8;
  for(let r=0;r<CFG.ROWS;r++){
    const y = M + r*(100-2*M)/(CFG.ROWS-1);
    const yPct = 25 + y*0.75;
    const last = r===CFG.ROWS-1;
    const t = (r+1)/CFG.ROWS;
    let xPct = ENTRY_X + (colX(col)-ENTRY_X)*t;
    if(!last) xPct += rnd(-2.2,2.2);                     // 中间几步带点抖动，别走成直线
    else xPct = colX(col);                                // 最后一排必须精确落到目标出口
    const pt = boardPt(xPct, yPct);
    placeBall(pt); spawnTrail(pt);
    (r%2 ? SFX.bounce : SFX.thud)();
    await wait(150);
  }

  // 4) 落进出口槽
  placeBall(exitPt(col));
  ball.classList.remove('spin');
  ball.classList.add('squash');
  SFX.thud();
  await wait(200);
  ball.classList.remove('squash');
  exits[col].classList.add('landed');

  await wait(500);
  placeBallInstant(railRestXY());     // 球回到内轨里，安静等下一轮
  finish(win, G.mult, col);
}

function finish(win, mult, col){
  G.state = 'settle';
  const bet = G.bet; G.bet = 0; setNum(uiBet, 0);
  if(win){
    const payout = bet*mult;
    G.marbles += payout; setNum(uiMarbles, G.marbles);
    SFX.win(mult);
    document.querySelector('.pinball').classList.add('punch');
    setTimeout(()=>document.querySelector('.pinball').classList.remove('punch'), 320);
    confetti();
    toast('🎯', `中了 ${mult}×！`, `投入 ${bet} 颗，从第 ${col+1} 号口出局，赢回 ${payout} 颗`);
    log(`中 ${mult}×｜投入 ${bet} 颗，赢回 ${payout} 颗`);
  }else{
    SFX.fail();
    toast('💢', '差一点…', `投入 ${bet} 颗，从第 ${col+1} 号口出局，没落在亮灯出口上`);
    log(`未中｜投入 ${bet} 颗打了水漂`);
  }
  refreshBetButtons();
}
function toast(em,h,p){
  el('t_em').textContent=em; el('t_h').textContent=h; el('t_p').textContent=p;
  el('toast').classList.add('show');
}
function closeToast(){
  el('toast').classList.remove('show');
  clearLights(); uiRoundMult.textContent='--';
  G.state='idle'; btnStop.disabled = true;
  refreshBetButtons();
}
el('t_ok').onclick = closeToast;
el('t_close').onclick = closeToast;
el('toast').addEventListener('click', e=>{ if(e.target.id==='toast') closeToast(); });

/* ══════════════════════════════════════════════════════════════
   5.5 调试面板
   ══════════════════════════════════════════════════════════════ */
const dev = el('dev');
dev.querySelector('.dh').onclick = ()=>{
  dev.classList.toggle('hid');
  el('devt').textContent = dev.classList.contains('hid') ? '+' : '−';
};
el('s_bias').oninput = e=>{
  CFG.winBias = (+e.target.value)/100;
  el('v_bias').textContent = e.target.value+'%';
};
el('b_free').onclick = ()=>{
  G.marbles += 50; setNum(uiMarbles, G.marbles); refreshBetButtons(); SFX.coin();
};
el('b_reset').onclick = ()=>{
  if(G.state!=='idle') return;
  G.marbles = CFG.START_MARBLES; G.bet = 0;
  setNum(uiMarbles, G.marbles); setNum(uiBet, 0);
  refreshBetButtons(); log('已重置');
};
refreshBetButtons();

/* ══════════════════════════════════════════════════════════════
   6. 自检：赔率必须跟亮灯数量对得上，倍率抽取必须均匀
   ══════════════════════════════════════════════════════════════ */
window.__plinko = {CFG, G, pickRound, rollLanding, addMarbles};
(function selfCheck(){
  const N = 200000;
  const multCount = {}; CFG.MULTS.forEach(m=>multCount[m]=0);
  const winByMult = {}; CFG.MULTS.forEach(m=>winByMult[m]={win:0,total:0});
  let badCol = 0;
  for(let i=0;i<N;i++){
    const {mult, lit} = pickRound();
    multCount[mult]++;
    const {win, col} = rollLanding(lit);
    winByMult[mult].total++; if(win) winByMult[mult].win++;
    if(col<0 || col>=CFG.N_EXIT || !Number.isInteger(col)) badCol++;
  }
  console.assert(badCol===0, `出口序号越界 ${badCol} 次`);
  for(const m of CFG.MULTS){
    const expect = CFG.LIT_COUNT[m]/CFG.N_EXIT;
    const got = winByMult[m].win/winByMult[m].total;
    console.assert(Math.abs(got-expect)<0.02, `${m}× 命中率 ${(got*100).toFixed(1)}% 偏离预期 ${(expect*100).toFixed(1)}%`);
    const pShare = multCount[m]/N, expectShare = CFG.MULT_WEIGHTS[m]/MULT_WEIGHT_TOTAL;
    console.assert(Math.abs(pShare-expectShare)<0.01,
      `${m}× 抽取占比 ${(pShare*100).toFixed(1)}% 偏离预期 ${(expectShare*100).toFixed(1)}%`);
  }
  // 权重必须严格递减：倍率越高越难摇到，这条不成立说明配错了
  for(let i=1;i<CFG.MULTS.length;i++){
    console.assert(CFG.MULT_WEIGHTS[CFG.MULTS[i]] <= CFG.MULT_WEIGHTS[CFG.MULTS[i-1]],
      `MULT_WEIGHTS 没有随倍率递减：${CFG.MULTS[i-1]}×=${CFG.MULT_WEIGHTS[CFG.MULTS[i-1]]} < ${CFG.MULTS[i]}×=${CFG.MULT_WEIGHTS[CFG.MULTS[i]]}`);
  }
  console.log('[selfcheck] 弹弹珠 命中率(占比)：', CFG.MULTS.map(m=>
    `${m}×=${(winByMult[m].win/winByMult[m].total*100).toFixed(1)}%(${(multCount[m]/N*100).toFixed(0)}%)`).join('  '));
})();
</script>
